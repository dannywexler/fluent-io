[package]
categories = ["filesystem", "multimedia::images", "multimedia::video"]
description = "A library designed to make IO operations involving commands, files and folders easier"
edition = "2024"
exclude = ["/test_data"]
keywords = ["command", "file", "folder", "io"]
license = "MIT"
name = "fluent-io"
repository = "https://github.com/dannywexler/fluent-io"
version = "0.1.0"

[dependencies]
camino = "1.2.5"
image = "0.25.10"
imghash = "2.0.0"
jiff = { version = "0.2.37", features = ["serde"] }
monostate = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
walkdir = "2.5.0"
which = "8.0.6"
